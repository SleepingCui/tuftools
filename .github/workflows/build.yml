name: build
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '选择要构建的分支'
        required: true
        default: 'main'
        type: string

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}
        fetch-depth: 0

    - name: Set up MinGW-w64, CMake and Ninja
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

    - name: Generate Version and Release Tag
      id: meta
      shell: bash
      run: |
        BUILD_DATE=$(date +'%Y%m%d')
        BUILD_CLOCK=$(date +'%H%M%S')
        SHORT_SHA=$(git rev-parse --short HEAD)
        TAG_NAME="${BUILD_DATE}-${SHORT_SHA}"
        BUILD_STAMP="${BUILD_DATE:0:4}-${BUILD_DATE:4:2}-${BUILD_DATE:6:2} ${BUILD_CLOCK:0:2}:${BUILD_CLOCK:2:2}:${BUILD_CLOCK:4:2}"
        echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
        echo "BUILD_STAMP=${BUILD_STAMP}" >> $GITHUB_ENV
        echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
        echo "commit=${SHORT_SHA}" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Configure (CMake + Ninja)
      shell: msys2 {0}
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DTUF_VERSION="${TAG_NAME}" -DTUF_BUILD_TIME="${BUILD_STAMP} UTC"

    - name: Build
      shell: msys2 {0}
      run: cmake --build build --parallel

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.meta.outputs.tag }}
        target_commitish: ${{ steps.meta.outputs.sha }}
        name: ci-${{ steps.meta.outputs.tag }}
        body: |
          build with CMake + MinGW-w64 (Ninja)
          Commit: ${{ steps.meta.outputs.commit }}
          Compiled at: ${{ env.BUILD_STAMP }} (UTC)
        files: |
          build/tuftools.exe

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
